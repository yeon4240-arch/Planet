    <script src="https://unpkg.com/lucide@latest"></script>

<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold flex items-center gap-2 text-red-500">
                <i data-lucide="utensils-crossed"></i> 미식 가이드
            </h1>
            <div id="location-status" class="flex items-center gap-2 bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium transition-all">
                <i data-lucide="map-pin" class="animate-pulse text-gray-400"></i>
                <span>위치 권한을 확인 중입니다...</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div class="flex bg-gray-200 p-1 rounded-xl w-fit" id="city-tabs">
                <button onclick="switchCity('nagoya')" id="tab-nagoya" class="px-6 py-2.5 rounded-lg text-sm font-bold transition-all bg-white text-gray-900 shadow-xs cursor-pointer">
                    나고야 🏯
                </button>
                <button onclick="switchCity('osaka')" id="tab-osaka" class="px-6 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-500 hover:text-gray-900 cursor-pointer">
                    오사카 🐙
                </button>
            </div>

            <div class="flex gap-2" id="category-filters">
                <button onclick="filterCategory('all')" id="filter-all" class="px-4 py-2 rounded-lg text-xs font-bold border border-red-500 bg-red-50 text-red-600 transition-all cursor-pointer">전체</button>
                <button onclick="filterCategory('food')" id="filter-food" class="px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white text-gray-600 hover:border-gray-300 transition-all cursor-pointer">식사</button>
                <button onclick="filterCategory('dessert')" id="filter-dessert" class="px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white text-gray-600 hover:border-gray-300 transition-all cursor-pointer">디저트/카페</button>
            </div>
        </div>

        <div id="restaurant-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

                { name: "Taza de Cafe", category: "dessert", rating: 4.3, menu: "수제 티라미수 케이크 & 아메리카노", price: "￥850 ~ ￥1,500", img: "https://images.unsplash.com/photo-1509460913899-515f1df34fea?w=600&auto=format&fit=crop&q=80" },

        const COORDINATES = {
            nagoya: { lat: 35.1709, lng: 136.8815 },
            osaka: { lat: 34.7024, lng: 135.4959 }
        };

        let currentCity = 'nagoya';
        let currentFilter = 'all';

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function checkLocation() {
            const statusEl = document.getElementById('location-status');
            
            if (!navigator.geolocation) {
                statusEl.className = "flex items-center gap-2 bg-yellow-100 text-yellow-700 px-4 py-2 rounded-full text-sm font-medium";
                statusEl.innerHTML = `<i data-lucide="alert-circle"></i><span>위치 서비스를 지원하지 않는 브라우저입니다.</span>`;
                lucide.createIcons();
                renderCards();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;

                    const distToNagoya = getDistance(userLat, userLng, COORDINATES.nagoya.lat, COORDINATES.nagoya.lng);
                    const distToOsaka = getDistance(userLat, userLng, COORDINATES.osaka.lat, COORDINATES.osaka.lng);

                    if (distToNagoya < distToOsaka) {
                        currentCity = 'nagoya';
                        statusEl.innerHTML = `<i data-lucide="check-circle-2" class="text-emerald-500"></i><span>현재 위치에서 <b>나고야</b>가 더 가깝습니다!</span>`;
                        statusEl.className = "flex items-center gap-2 bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full text-sm font-medium border border-emerald-200";
                    } else {
                        currentCity = 'osaka';
                        statusEl.innerHTML = `<i data-lucide="check-circle-2" class="text-emerald-500"></i><span>현재 위치에서 <b>오사카</b>가 더 가깝습니다!</span>`;
                        statusEl.className = "flex items-center gap-2 bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full text-sm font-medium border border-emerald-200";
                    }
                    
                    updateTabUI();
                    renderCards();
                },
                (error) => {
                    statusEl.className = "flex items-center gap-2 bg-amber-50 text-amber-700 px-4 py-2 rounded-full text-sm font-medium border border-amber-200";
                    statusEl.innerHTML = `<i data-lucide="info"></i><span>위치 권한 미수락 (기본: 나고야 설정)</span>`;
                    lucide.createIcons();
                    renderCards();
                }
            );
        }

        function updateTabUI() {
            const cities = ['nagoya', 'osaka'];
            cities.forEach(city => {
                const tab = document.getElementById(`tab-${city}`);
                if (city === currentCity) {
                    tab.className = "px-6 py-2.5 rounded-lg text-sm font-bold transition-all bg-white text-gray-900 shadow-xs cursor-pointer";
                } else {
                    tab.className = "px-6 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-500 hover:text-gray-900 cursor-pointer";
                }
            });
        }

        function switchCity(city) {
            currentCity = city;
            updateTabUI();
            renderCards();
        }

        function filterCategory(category) {
            currentFilter = category;
            const filters = ['all', 'food', 'dessert'];
            
            filters.forEach(f => {
                const filterBtn = document.getElementById(`filter-${f}`);
                if (f === category) {
                    filterBtn.className = "px-4 py-2 rounded-lg text-xs font-bold border border-red-500 bg-red-50 text-red-600 transition-all cursor-pointer";
                } else {
                    filterBtn.className = "px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white text-gray-600 hover:border-gray-300 transition-all cursor-pointer";
                }
            });
            renderCards();
        }

        function openGoogleMaps(queryName) {
            const encodedQuery = encodeURIComponent(queryName);
            const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
            window.open(googleMapsUrl, '_blank');
        }

        // 이미지 로딩 실패 시 플레이스홀더로 교체하는 핸들러 함수
        function handleImgError(imgElement) {
            imgElement.onerror = null; // 무한 루프 방지
            imgElement.src = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80";
        }

        function renderCards() {
            const grid = document.getElementById('restaurant-grid');
            grid.innerHTML = '';

            const list = restaurants[currentCity].filter(item => {
                return currentFilter === 'all' ? true : item.category === currentFilter;
            });

            if(list.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400">등록된 매장이 없습니다.</div>`;
                return;
            }

            list.forEach(shop => {
                const card = document.createElement('div');
                card.onclick = () => openGoogleMaps(`${shop.name} ${currentCity === 'nagoya' ? 'Nagoya' : 'Osaka'}`);
                card.className = "bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group flex flex-col cursor-pointer relative";
                
                card.innerHTML = `
                    <div class="relative overflow-hidden h-48 bg-gray-100">
                        <img src="${shop.img}" alt="${shop.name}" onerror="handleImgError(this)" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <span class="absolute top-3 left-3 px-2.5 py-1 text-xs font-extrabold rounded-md shadow-md ${shop.category === 'food' ? 'bg-orange-500 text-white' : 'bg-pink-500 text-white'} z-10">
                            ${shop.category === 'food' ? '식사' : '디저트'}
                        </span>
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-1.5 text-white font-bold text-sm">
                            <i data-lucide="map" class="w-4 h-4"></i> 구글 지도 보기
                        </div>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center gap-1.5 text-amber-500 text-sm font-bold mb-1">
                                <i data-lucide="star" class="w-4 h-4 fill-amber-500"></i>
                                <span>${shop.rating.toFixed(1)}</span>
                            </div>
                            <h3 class="text-base font-bold text-gray-900 tracking-tight line-clamp-1 mb-1 group-hover:text-red-500 transition-colors">${shop.name}</h3>
                            <p class="text-sm text-gray-600 flex items-center gap-1 mb-1.5">
                                <span class="text-gray-400 font-medium shrink-0">메뉴:</span> <span class="line-clamp-1">${shop.menu}</span>
                            </p>
                        </div>
                        <div class="pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
                            <span class="flex items-center gap-1"><i data-lucide="wallet" class="w-3.5 h-3.5"></i> 예산 범위</span>
                            <span class="font-bold text-gray-700 text-sm">${shop.price}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        window.onload = () => {
            checkLocation();
        };
    </script>
